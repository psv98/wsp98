name: Build and publish

on:
  push:
    branches: [main]
    paths-ignore: ['play/**']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Режим «Deploy from a branch»: зібрана гра лежить у теці play/ гілки main,
      # а кореневий index.html перенаправляє туди.
      - name: Update play/ with the fresh build
        run: |
          # старі файли збірки не видаляємо: сторінки, відкриті до релізу, продовжать працювати
          mkdir -p play
          cp -r dist/. play/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A play
          if git diff --cached --quiet; then
            echo "play/ is up to date"
          else
            git commit -m "Оновлено зібрану гру (play/) [skip ci]"
            git push
          fi
      # Режим «GitHub Actions»: публікуємо dist напряму (якщо цей режим не ввімкнено, крок просто пропускається).
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
